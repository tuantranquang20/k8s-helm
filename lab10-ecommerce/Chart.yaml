apiVersion: v2
name: ecommerce-platform
description: Complete E-Commerce Platform with Microservices - Lab 10
type: application
version: 1.0.0
appVersion: "1.0"

keywords:
  - ecommerce
  - microservices
  - online-store
  - shopping
  - lab10

maintainers:
  - name: K8s Lab Student
    email: student@k8s-lab.local

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: rabbitmq
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
