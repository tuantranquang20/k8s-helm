{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce-platform.fullname" . }}-frontend
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "ecommerce-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "ecommerce-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: CATALOG_SERVICE_URL
          value: "http://{{ include \"ecommerce-platform.fullname\" . }}-catalog:{{ .Values.catalog.service.port }}"
        - name: CART_SERVICE_URL
          value: "http://{{ include \"ecommerce-platform.fullname\" . }}-cart:{{ .Values.cart.service.port }}"
        - name: ORDER_SERVICE_URL
          value: "http://{{ include \"ecommerce-platform.fullname\" . }}-order:{{ .Values.order.service.port }}"
        - name: USER_SERVICE_URL
          value: "http://{{ include \"ecommerce-platform.fullname\" . }}-user:{{ .Values.user.service.port }}"
        - name: PAYMENT_SERVICE_URL
          value: "http://{{ include \"ecommerce-platform.fullname\" . }}-payment:{{ .Values.payment.service.port }}"
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce-platform.fullname" . }}-frontend
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "ecommerce-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
