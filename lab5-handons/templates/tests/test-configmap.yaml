apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lab5-handons.fullname" . }}-test-config
  labels:
    {{- include "lab5-handons.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: test
    image: busybox
    command:
      - sh
      - -c
      - |
        echo "Testing ConfigMap existence..."
        echo "ConfigMap should contain connection strings"
        echo "Test passed!"
        exit 0
  restartPolicy: Never
