apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lab5-handons.fullname" . }}-test-connection
  labels:
    {{- include "lab5-handons.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: wget
    image: busybox
    command: ['wget']
    args: ['{{ include "lab5-handons.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
