# Shopping Cart Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: ecommerce
  labels:
    app: ecommerce
    component: cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce
      component: cart
  template:
    metadata:
      labels:
        app: ecommerce
        component: cart
    spec:
      containers:
      - name: cart
        image: nginx:latest
        ports:
        - containerPort: 8002
        env:
        - name: SERVICE_NAME
          value: "cart-service"
        - name: PORT
          value: "8002"
        - name: DATABASE_URL
          value: "postgresql://ecommerce:ecommerce-password@postgresql:5432/ecommerce"
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          limits:
            cpu: 300m
            memory: 384Mi
          requests:
            cpu: 150m
            memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: ecommerce
  labels:
    app: ecommerce
    component: cart
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    name: http
  selector:
    app: ecommerce
    component: cart
---
# Order Service
apiVersion: apps/v1
kind: Deployment
