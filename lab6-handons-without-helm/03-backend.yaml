# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fullstack-app
  labels:
    app: fullstack-app
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fullstack-app
      component: backend
  template:
    metadata:
      labels:
        app: fullstack-app
        component: backend
    spec:
      containers:
      - name: backend
        image: nginx:1.22
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: database-url
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fullstack-app
  labels:
    app: fullstack-app
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: fullstack-app
    component: backend
