apiVersion: v2
name: voting-app
description: Complete Voting Application Microservices - Lab 7
type: application
version: 1.0.0
appVersion: "1.0"

keywords:
  - voting
  - microservices
  - redis
  - postgresql
  - lab7

maintainers:
  - name: K8s Lab Student
    email: student@k8s-lab.local

dependencies:
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
