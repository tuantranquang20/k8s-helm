replicaCount: 3

image:
  repository: nginx
  tag: "1.22"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

app:
  name: advanced-app
  environment: staging
  logLevel: debug

database:
  enabled: true
  username: appuser
  password: securepassword
  host: postgres
  port: 5432
  name: appdb

redis:
  enabled: true
  host: redis
  port: 6379
  password: redispass

extraEnvVars:
  - name: API_ENDPOINT
    value: "https://api.example.com"
  - name: FEATURE_FLAG_NEW_UI
    value: "true"
  - name: MAX_UPLOAD_SIZE
    value: "10485760"

tags:
  - staging
  - backend
  - api

functionsDemo:
  enabled: true

postgresql:
  enabled: true
  auth:
    username: appuser
    password: securepassword
    database: appdb
  primary:
    persistence:
      enabled: false

cache:
  enabled: true
