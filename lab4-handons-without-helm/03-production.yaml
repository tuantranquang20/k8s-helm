# Production ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-prod
  namespace: custom-app
  labels:
    app: nginx-app
    component: config
    environment: production
data:
  app-name: "my-app"
  environment: "production"
  log-level: "error"
---
# Production Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app-prod
  namespace: custom-app
  labels:
    app: nginx-app
    version: v1.0.0
    environment: production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx-app-prod
      environment: production
  template:
    metadata:
      labels:
        app: nginx-app-prod
        environment: production
        version: v1.0.0
    spec:
      containers:
      - name: nginx
        image: nginx:1.22
        ports:
        - containerPort: 80
          name: http
        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config-prod
              key: app-name
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config-prod
              key: environment
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config-prod
              key: log-level
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Production Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-app-prod
  namespace: custom-app
  labels:
    app: nginx-app
    environment: production
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: nginx-app-prod
    environment: production
